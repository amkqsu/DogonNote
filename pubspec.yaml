name: dogonnote
description: "AI destekli, koyu temalı not alma uygulaması."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  google_fonts: ^6.2.1
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  path_provider: ^2.1.3
  http: ^1.2.1
  intl: ^0.19.0
  uuid: ^4.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  hive_generator: ^2.0.1
  build_runner: ^2.4.11
  flutter_launcher_icons: ^0.13.1
  flutter_native_splash: ^2.4.1

flutter:
  uses-material-design: true
  assets:
    - assets/icon/logo.png

# ---------------------------------------------------------------
# Uygulama ikonu ayarları — logo.png'yi assets/icon/logo.png olarak
# koy, sonra: flutter pub run flutter_launcher_icons
# ---------------------------------------------------------------
flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/logo.png"
  min_sdk_android: 21
  adaptive_icon_background: "#0A0A0B"
  adaptive_icon_foreground: "assets/icon/logo.png"
  remove_alpha_ios: false

# ---------------------------------------------------------------
# Açılış (splash) ekranı native native — anlık logo göstermek için.
# Kısa Flutter içi animasyon (lib/screens/splash_screen.dart) bunun
# hemen ardından devreye girer.
# ---------------------------------------------------------------
flutter_native_splash:
  color: "#0A0A0B"
  image: assets/icon/logo.png
  android_12:
    color: "#0A0A0B"
    image: assets/icon/logo.png
